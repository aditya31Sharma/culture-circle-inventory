<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKU Image Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b12;
      --panel: #111722;
      --panel-2: #161d2a;
      --line: rgba(255, 255, 255, 0.1);
      --text: #f7f8fb;
      --muted: #9aa3b2;
      --soft: #c8ced8;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --ok: #3ddc97;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(124, 92, 255, 0.22), transparent 34rem),
        radial-gradient(circle at top right, rgba(34, 211, 238, 0.16), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent-2);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .hero p {
      max-width: 760px;
      margin: 12px 0 0;
      color: var(--soft);
      font-size: 15px;
      line-height: 1.55;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(110px, 1fr));
      gap: 10px;
    }

    .stat {
      min-width: 132px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(17, 23, 34, 0.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      margin: 0 0 18px;
      padding: 12px 0;
      background: linear-gradient(180deg, rgba(8, 11, 18, 0.94), rgba(8, 11, 18, 0.78));
      backdrop-filter: blur(16px);
    }

    .search {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      outline: none;
      background: rgba(17, 23, 34, 0.86);
      color: var(--text);
    }

    .search:focus {
      border-color: rgba(124, 92, 255, 0.72);
      box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.14);
    }

    .copy-all {
      height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      cursor: pointer;
      font-weight: 750;
      white-space: nowrap;
      box-shadow: 0 14px 36px rgba(79, 70, 229, 0.28);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(22, 29, 42, 0.9), rgba(13, 18, 28, 0.92));
      box-shadow: var(--shadow);
    }

    .image-wrap {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 1 / 1;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent),
        #eef1f6;
    }

    .image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 18px;
      transition: transform 180ms ease;
    }

    .card:hover img {
      transform: scale(1.025);
    }

    .brand {
      position: absolute;
      left: 12px;
      top: 12px;
      max-width: calc(100% - 24px);
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(8, 11, 18, 0.78);
      color: #fff;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      backdrop-filter: blur(10px);
    }

    .body {
      display: grid;
      gap: 12px;
      padding: 15px;
    }

    .title {
      min-height: 44px;
      margin: 0;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--soft);
      background: rgba(255, 255, 255, 0.04);
      font-size: 12px;
      font-weight: 650;
    }

    .sku-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
    }

    .sku {
      min-width: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .copy {
      height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(124, 92, 255, 0.42);
      border-radius: 999px;
      color: #fff;
      background: rgba(124, 92, 255, 0.2);
      cursor: pointer;
      font-size: 12px;
      font-weight: 760;
    }

    .copy.copied {
      border-color: rgba(61, 220, 151, 0.48);
      color: #d9fff0;
      background: rgba(61, 220, 151, 0.18);
    }

    .empty,
    .image-error {
      display: none;
      color: var(--muted);
      text-align: center;
    }

    .empty {
      margin: 36px 0;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(17, 23, 34, 0.75);
    }

    .image-error {
      position: absolute;
      inset: 0;
      place-items: center;
      padding: 18px;
      background: #111722;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      transform: translateY(18px);
      opacity: 0;
      pointer-events: none;
      padding: 12px 16px;
      border: 1px solid rgba(61, 220, 151, 0.34);
      border-radius: 999px;
      color: #eafff6;
      background: rgba(12, 27, 23, 0.9);
      box-shadow: var(--shadow);
      transition: opacity 160ms ease, transform 160ms ease;
      backdrop-filter: blur(14px);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 720px) {
      .shell {
        width: min(100% - 22px, 560px);
        padding-top: 22px;
      }

      .hero {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .copy-all {
        width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    ];

    const grid = document.getElementById("skuGrid");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("searchInput");
    const copyAllButton = document.getElementById("copyAllButton");
    const toast = document.getElementById("toast");
    let toastTimer;

    document.getElementById("totalCount").textContent = products.length;
    document.getElementById("foundCount").textContent = products.filter((product) => product.found && product.imageUrl).length;

    function formatPrice(product) {
      if (!product.lowestPrice) return "No price";
      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: product.marketCurrency || "INR",
        maximumFractionDigits: 0
      }).format(product.lowestPrice);
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1400);
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (error) {
        // Fall through to textarea fallback.
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      const ok = document.execCommand("copy");
      textarea.remove();
      return ok;
    }

    function render(items) {
      grid.innerHTML = "";
      emptyState.style.display = items.length ? "none" : "block";

      const fragment = document.createDocumentFragment();
      items.forEach((product) => {
        const card = document.createElement("article");
        card.className = "card";
        card.dataset.search = `${product.sku} ${product.title} ${product.brandName}`.toLowerCase();

        card.innerHTML = `
          <div class="image-wrap">
            <span class="brand">${product.brandName || "Unknown brand"}</span>
            <img src="${product.imageUrl}" alt="${product.title || product.sku}" loading="lazy">
            <div class="image-error">Image unavailable</div>
          </div>
          <div class="body">
            <p class="title">${product.title || "Product not found"}</p>
            <div class="meta">
              <span class="pill">${product.subCategory || product.category || "Product"}</span>
              <span class="pill">${formatPrice(product)}</span>
            </div>
            <div class="sku-row">
              <span class="sku" title="${product.sku}">${product.sku}</span>
              <button class="copy" type="button" data-sku="${product.sku}">Copy</button>
            </div>
          </div>
        `;

        const img = card.querySelector("img");
        const imageError = card.querySelector(".image-error");
        img.addEventListener("error", () => {
          img.style.display = "none";
          imageError.style.display = "grid";
        });

        fragment.appendChild(card);
      });
      grid.appendChild(fragment);
    }

    function filterProducts() {
      const term = searchInput.value.trim().toLowerCase();
      if (!term) {
        render(products);
        return;
      }
      render(products.filter((product) => `${product.sku} ${product.title} ${product.brandName}`.toLowerCase().includes(term)));
    }

    grid.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-sku]");
      if (!button) return;
      const sku = button.dataset.sku;
      const ok = await copyText(sku);
      if (!ok) return;

      button.classList.add("copied");
      button.textContent = "Copied";
      showToast(`${sku} copied`);
      setTimeout(() => {
        button.classList.remove("copied");
        button.textContent = "Copy";
      }, 1100);
    });

    copyAllButton.addEventListener("click", async () => {
      const ok = await copyText(products.map((product) => product.sku).join("\\n"));
      if (ok) showToast("All SKUs copied");
    });

    searchInput.addEventListener("input", filterProducts);
    render(products);
  </script>
</body>
